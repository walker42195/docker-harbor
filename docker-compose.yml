# Basfil -- fungerar på vilken värd som helst.
# Maskinspecifika delar (NVIDIA-GPU och projektkatalog) läggs i
# docker-compose.override.yml, som genereras av ./setup.sh och som Docker
# Compose slår ihop med den här filen automatiskt.
services:
  docker-harbor:
    build: .
    container_name: docker-harbor
    restart: unless-stopped
    ports:
      - "6969:6969"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # All muterbar data (serverregister + infotexter) i EN persistent volym.
      # Överlever "docker compose down" och ombyggnad av imagen.
      - harbor-data:/app/data
    env_file:
      - .env
    labels:
      description: "Huvudsaklig kontrollpanel för Docker-containers på servern (Live
        redigerad)."

volumes:
  harbor-data:
