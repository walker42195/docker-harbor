services:
  docker-harbor:
    build: .
    container_name: docker-harbor
    restart: unless-stopped
    ports:
      - "6969:6969"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./descriptions.json:/app/descriptions.json
      - ./servers.json:/app/servers.json
      - /home/fredrik/Projects:/home/fredrik/Projects
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:ro
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility,compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    labels:
      description: "Huvudsaklig kontrollpanel för Docker-containers på servern (Live
        redigerad)."
